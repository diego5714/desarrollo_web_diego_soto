<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Publicación</title>
    
    <link rel="stylesheet" type="text/css" href="style/navbar.css">
    <link rel="stylesheet" type="text/css" href="style/form.css">
    <link rel="stylesheet" type="text/css" href="style/index.css">
</head>

<body>
    <div class="navbar">
        <div class="navbar-left">
            <a href="/" class="navbar-logo"> Plataforma de Adopción </a>
        </div>
        
        <div class="navbar-right">
            <div class="login-buttons">
                ¿Aun no tienes cuenta?
                <a href="/" class="btn btn-outline-success">Registrate</a>
            </div>
        </div>
    </div>
    
    <main>
        <div class="main-cols">
            <div class="publication-form">
                <form class="form-divider">
                    <div class="form-left">
                        <label for="region">Región:</label>
                        <select id="region" name="region">

                        </select>
                        
                        <label for="comuna">Comuna:</label>
                        <select id="comuna" name="comuna">

                        </select>
                        
                        <label for="sector">Sector:</label>
                        <input type="text" id="sector" name="sector">

                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre">

                        <label for="email">Correo:</label>
                        <input type="email" id="email" name="email">

                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono">
                    </div>

                    <div class="form-center">
                        <input type="radio" id="perro" name="tipo" value="Perro">
                        <label for="Tipo">Perro:</label>

                        <input type="radio" id="gato" name="tipo" value="Gato">
                        <label for="Tipo">Gato:</label>
                        
                        <label for="cantidad">Cantidad:</label>
                        <input type="number" id="cantidad" name="cantidad">
                        
                        <label for="region">Sector:</label>
                        <input type="text" id="sector" name="sector">

                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre">

                        <label for="unidad">Unidad:</label>
                        <input type="text" id="unidad" name="unidad">

                        <label for="fecha">Fecha de entrega:</label>
                        <input type="datetime-local" id="fecha" name="fecha">
                    </div>

                    <div class="form-right">
                        
                        <label for="descripcion">Descripción:</label>
                        <textarea name="descripcion" rows="10" cols="50">
                            
                        </textarea>

                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre">

                    </div>
                </form>
            </div>
        </div>
    </main>

</body>

</html>
