<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Publicación</title>
    
    <link rel="stylesheet" type="text/css" href="style/navbar.css">
    <link rel="stylesheet" type="text/css" href="style/form.css">
    <link rel="stylesheet" type="text/css" href="style/index.css">
</head>

<body>
    <div class="navbar">
        <div class="navbar-left">
            <a href="/" class="navbar-logo"> Plataforma de Adopción </a>
        </div>
        
        <div class="navbar-right">
            <div class="login-buttons">
                ¿Aun no tienes cuenta?
                <a href="/" class="btn btn-outline-success">Registrate</a>
            </div>
        </div>
    </div>
    
    <main>
        <div class="main-cols">
            <div class="publication-form">
                <form class="form-divider">
                    <div class="form-left">
                        <label for="region">Región:</label>
                        <select id="region" name="region">
                            <option>Elige una región</option>
                        </select>
                        
                        <label for="comuna">Comuna:</label>
                        <select id="comuna" name="comuna">
                            <option>Elige una comuna</option>
                        </select>
                        
                        <label for="sector">Sector:</label>
                        <input type="text" id="sector" name="sector">

                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre">

                        <label for="email">Correo:</label>
                        <input type="email" id="email" name="email">

                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono">
                    </div>

                    <div class="form-right">
                        <label for="Tipo">Tipo:</label>
                        <select id="tipo" name="tipo">
                            <option>Elige un tipo</option>
                            <option>Perro</option>
                            <option>Gato</option>
                        </select>

                        
                        <label for="cantidad">Cantidad:</label>
                        <input type="number" id="cantidad" name="cantidad">
                        
                        <label for="edad">Edad:</label>
                        <input type="number" id="edad" name="edad">

                        <label for="unidad">Unidad:</label>
                        <select id="unidad" name="unidad">
                            <option>Meses</option>
                            <option>Años</option>
                        </select>

                        <label for="fecha">Fecha de entrega:</label>
                        <input type="datetime-local" id="fecha" name="fecha">


                        <label for="descripcion">Descripción:</label>
                        <textarea name="descripcion" rows="10" cols="50">Ingresa una descripción (Opcional)</textarea>

                        <label for="Fotos">Fotos (Máximo 5):</label>
                        <input type="file" id="fotos1" name="fotos">
                        <input type="file" id="fotos2" name="fotos">
                        <input type="file" id="fotos3" name="fotos">
                        <input type="file" id="fotos4" name="fotos">
                        <input type="file" id="fotos5" name="fotos">

                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="scripts/region_comuna.js"></script>
    <script src="scripts/poblar_campos.js"></script>
    <script src="scripts/validate.js"></script>

</body>

</html>
