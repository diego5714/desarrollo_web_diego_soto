{% extends "base.html" %}

{% block title %}Estadísticas{% endblock %}

{% block style %}
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style/statistics.css') }}">
{% endblock %}

{% block content %}
    <div class="statistics-organizer">
        <div class="statistics-container">
            <div id="chart-container-daily" style="width:100%; height:400px;"></div>
        </div>

        <div class="statistics-container">
            <div id="chart-container-proportion" style="width:100%; height:400px;"></div>
        </div>

        <div class="statistics-container">
            <div id="chart-container-monthly" style="width:100%; height:400px;"></div>
        </div>
    </div>

{% endblock %}

{% block scripts %}
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="{{ url_for('static', filename='scripts/stats.js') }}"></script>
{% endblock %}
